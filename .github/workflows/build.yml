# SandaScan — Cross-Platform Build & Release
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build
        shell: cmd
        run: >
          pyinstaller --onefile --windowed --name "SandaScan.exe"
          --icon "SandaScan\assets\sandascan_app_icon.ico"
          --add-data "SandaScan\core;SandaScan\core"
          --add-data "SandaScan\gui;SandaScan\gui"
          --add-data "SandaScan\assets;SandaScan\assets"
          --hidden-import PIL._tkinter_finder
          run.py
      - uses: actions/upload-artifact@v5
        with:
          name: SandaScan-Windows
          path: dist/SandaScan.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          brew install tesseract
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: |
          pyinstaller --onedir --windowed \
            --name SandaScan \
            --add-data "SandaScan/assets:SandaScan/assets" \
            --add-data "SandaScan/core:SandaScan/core" \
            --add-data "SandaScan/gui:SandaScan/gui" \
            run.py
      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/SandaScan SandaScan-macOS.zip
      - uses: actions/upload-artifact@v5
        with:
          name: SandaScan-macOS
          path: SandaScan-macOS.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng python3-tk || true
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: |
          pyinstaller --onedir \
            --name SandaScan \
            --add-data "SandaScan/assets:SandaScan/assets" \
            --add-data "SandaScan/core:SandaScan/core" \
            --add-data "SandaScan/gui:SandaScan/gui" \
            --hidden-import PIL._tkinter_finder \
            run.py
      - uses: actions/upload-artifact@v5
        with:
          name: SandaScan-Linux
          path: dist/SandaScan
          if-no-files-found: error

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
      - name: Package
        run: |
          cp SandaScan-macOS/SandaScan-macOS.zip ./SandaScan-macOS.zip
          chmod +x SandaScan-Linux/SandaScan
          cp SandaScan-Linux/SandaScan ./SandaScan-linux
          mkdir -p win
          cp SandaScan-Windows/SandaScan.exe win/
          cp LICENSE win/
          cd win && zip -r ../SandaScan-Windows.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: SandaScan ${{ github.ref_name }}
          body: |
            ## 📄 SandaScan ${{ github.ref_name }}
            **Document Restoration Suite** — Transform phone photos into scanner-quality PDFs.
            
            ### 📥 Downloads
            - 🪟 [Windows](SandaScan-Windows.zip)
            - 🍎 [macOS](SandaScan-macOS.zip)
            - 🐧 [Linux](SandaScan-linux)
          files: |
            SandaScan-Windows.zip
            SandaScan-macOS.zip
            SandaScan-linux